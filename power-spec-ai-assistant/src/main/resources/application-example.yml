spring:
  servlet:
    multipart:
      max-file-size: 50MB      # 单个文件最大大小
      max-request-size: 50MB
  ai:
    openai:
      # DeepSeek API ?????OpenAI???
      base-url: https://api.deepseek.com
      # ??DeepSeek API Key??deepseek.com???
      api-key: your_apikey
      chat:
        options:
          # ????
          model: deepseek-chat
          # ???????????????0.1-0.3
          temperature: 0.2
          # ????token
          max-tokens: 2048
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
        database-name: default
        collection-name: power_spec_knowledge
        embedding-dimension: 1536 # 和DeepSeek嵌入模型维度对应
        initialize-schema: true
tongyi:
  embedding:
    base_url: https://llm-5iwbjc3jdg7xi6zj.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api-key: your_apikey
    model: text-embedding-v2
# 阿里云 OCR 配置（和通义千问共用阿里云账号AK/SK）
aliyun:
  ocr:
    access-key-id: your_key
    access-key-secret: your_secret
    endpoint: ocr-api.cn-hangzhou.aliyuncs.com
    qps: 10
server:
  port: 8888

